<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>俄罗斯方块 Plus</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud" class="hud">
        <div class="hud-top">
          <div class="brand">
            <span class="brand-mark">T+</span>
            <span class="brand-name">俄罗斯方块 Plus</span>
          </div>
          <div class="hud-stats">
            <div class="stat">
              <span class="stat-label">分数</span>
              <span class="stat-value" id="stat-score">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">阶段</span>
              <span class="stat-value" id="stat-stage">一</span>
            </div>
            <div class="stat">
              <span class="stat-label">FPS</span>
              <span class="stat-value" id="stat-fps">--</span>
            </div>
          </div>
        </div>
        <div class="hud-bottom">
          <span id="hint">M0 骨架：场景、相机、配置加载、帧循环已就绪</span>
          <span id="seed-label" class="seed-label"></span>
        </div>
      </div>

      <div id="loading" class="loading">
        <div class="loading-inner">
          <div class="loading-logo">T+</div>
          <div class="loading-text">正在初始化渲染器…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
