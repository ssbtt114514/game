name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/actions/godot-android-export/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/actions/godot-android-export/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (disable dev mode)"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable dev mode for non-release builds
        if: ${{ !inputs.release && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/project.godot")
          path.write_text(path.read_text().replace("dev_mode=false", "dev_mode=true"))
          PY
          grep -n "dev_mode" godot/project.godot

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Create signing keystore and export credentials
        env:
          KEYSTORE_PASS: tetrisplus-ci
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/tetrisplus.keystore" \
            -alias tetrisplus \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Tetris Plus,O=MonkeyCode,C=CN"
          mkdir -p godot/.godot godot/build
          cat > godot/.godot/export_credentials.cfg <<CREDS
          [preset.0]

          script_encryption_key=""

          [preset.0.options]

          keystore/debug="$GITHUB_WORKSPACE/tetrisplus.keystore"
          keystore/debug_user="tetrisplus"
          keystore/debug_password="$KEYSTORE_PASS"
          keystore/release="$GITHUB_WORKSPACE/tetrisplus.keystore"
          keystore/release_user="tetrisplus"
          keystore/release_password="$KEYSTORE_PASS"
          CREDS

      - name: Export Android APK
        uses: ./.github/actions/godot-android-export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tetrisplus.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tetrisplus
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: tetrisplus-ci
        with:
          godot-version: "4.3"
          working-directory: godot

      - name: Export 32-bit compatibility APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/project.godot")
          text = path.read_text()
          text = text.replace('renderer/rendering_method="mobile"', 'renderer/rendering_method="gl_compatibility"')
          text = text.replace('renderer/rendering_method.mobile="mobile"', 'renderer/rendering_method.mobile="gl_compatibility"')
          path.write_text(text)
          PY
          grep -n "rendering_method" godot/project.godot
          godot --headless --path godot --export-release Android godot/build/tetris-plus-gl.apk
          test -f godot/build/tetris-plus-gl.apk

      - name: Split APKs by ABI
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for pair in "64:arm64-v8a:godot/build/tetris-plus.apk" "32:armeabi-v7a:godot/build/tetris-plus-gl.apk"; do
            suffix="${pair%%:*}"
            rest="${pair#*:}"
            keep="${rest%%:*}"
            SRC="${rest##*:}"
            out="godot/build/tetris-plus-${suffix}.apk"
            cp "$SRC" "$out"
            if [ "$keep" = "arm64-v8a" ]; then
              zip -q -d "$out" "lib/armeabi-v7a/*"
            else
              zip -q -d "$out" "lib/arm64-v8a/*"
            fi
            "$BUILD_TOOLS/zipalign" -f -p 4 "$out" "$out.tmp"
            mv "$out.tmp" "$out"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$GITHUB_WORKSPACE/tetrisplus.keystore" \
              --ks-pass pass:tetrisplus-ci \
              --ks-key-alias tetrisplus \
              --key-pass pass:tetrisplus-ci "$out"
            unzip -l "$out" | grep "libgodot_android.so"
            sha256sum "$out" | tee "$out.sha256"
          done

      - name: Verify APKs
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for out in godot/build/tetris-plus-32.apk godot/build/tetris-plus-64.apk; do
            test -f "$out"
            ls -lh "$out"
            "$BUILD_TOOLS/apksigner" verify --verbose "$out"
            if [ -x "$BUILD_TOOLS/aapt2" ]; then
              "$BUILD_TOOLS/aapt2" dump badging "$out" | head -5
            fi
          done

      - name: Upload 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: tetris-plus-android32
          path: |
            godot/build/tetris-plus-32.apk
            godot/build/tetris-plus-32.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: tetris-plus-android64
          path: |
            godot/build/tetris-plus-64.apk
            godot/build/tetris-plus-64.apk.sha256
          retention-days: 30
          if-no-files-found: error
