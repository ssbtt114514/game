name: Windows & Web

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/builds.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/builds.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (disable dev mode)"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_DIR: "4.3.stable"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            preset: "Windows Desktop"
            output: "build/windows/tetris-plus.exe"
            artifact: tetris-plus-windows
            upload_path: godot/build/windows
          - label: Web
            preset: "Web"
            output: "build/web/index.html"
            artifact: tetris-plus-web
            upload_path: godot/build/web
    steps:
      - uses: actions/checkout@v4

      - name: Enable dev mode for non-release builds
        if: ${{ !inputs.release && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("godot/project.godot")
          path.write_text(path.read_text().replace("dev_mode=false", "dev_mode=true"))
          PY
          grep -n "dev_mode" godot/project.godot

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Download Godot
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: Download export templates
        run: |
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_DIR}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_DIR}/"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_DIR}" | head

      - name: Import project
        run: |
          /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path godot --editor --quit

      - name: Export ${{ matrix.label }}
        run: |
          mkdir -p "$(dirname "godot/${{ matrix.output }}")"
          /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path godot --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          ls -lh "godot/$(dirname "${{ matrix.output }}")"

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error
